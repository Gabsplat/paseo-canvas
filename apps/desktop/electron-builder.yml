# Unsigned unless the release workflow finds signing secrets (docs/desktop.md). Updates: docs/desktop.md, "Updates".
appId: dev.gabsplat.lienzo
productName: Lienzo
copyright: Copyright © 2026 gabsplat
directories:
  output: release
  buildResources: build
# Everything the app runs is bundled into dist/ by scripts/bundle.mjs; no node_modules ship.
files:
  - dist/**/*
  - "!dist/**/*.map"
  - package.json
asar: true
# The update feed. With --publish never, electron-builder still writes latest*.yml and the .blockmap files next to
# the installers; the release workflow uploads them. GitHub's /releases/latest/download/ redirects to the newest
# non-prerelease release, so the "desktop-v" tag names are never parsed. The app sets the same URL itself.
publish:
  provider: generic
  url: https://github.com/Gabsplat/paseo-canvas/releases/latest/download
# .lienzo files open with the app (docs/desktop.md, "Lienzo files"): macOS sends open-file, Windows and Linux pass the
# path as an argument, forwarded to the running app by the single-instance lock. Linux AppImages register the type only
# once integrated (AppImageLauncher or appimaged), which writes the .desktop entry with this MimeType.
fileAssociations:
  - ext: lienzo
    name: Lienzo
    description: A Lienzo canvas
    mimeType: application/vnd.lienzo+json
    role: Editor
linux:
  target: [AppImage]
  category: Graphics
  syncDesktopName: true
  synopsis: A canvas you and your agent draw explanations on.
  maintainer: gabsplat <gabsplat@users.noreply.github.com>
  icon: build/icon.png
  artifactName: Lienzo-${version}-${arch}.${ext}
mac:
  target: [dmg, zip]
  category: public.app-category.productivity
  hardenedRuntime: false
  artifactName: Lienzo-${version}-mac-${arch}.${ext}
  icon: build/icon.png
# The installer window: the canvas paper, the app on the left, Applications on the right, a drawn arrow between.
# background.tiff holds the 1x and 2x images; build:mac makes it with tiffutil from build/background*.png.
win:
  target: [{ target: nsis, arch: [x64, arm64] }]
  icon: build/icon.png
  artifactName: Lienzo-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: Lienzo
dmg:
  title: Lienzo
  background: build/background.tiff
  iconSize: 128
  iconTextSize: 13
  window: { width: 660, height: 400 }
  contents:
    - { x: 165, y: 220, type: file }
    - { x: 495, y: 220, type: link, path: /Applications }
