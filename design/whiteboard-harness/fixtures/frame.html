<!doctype html><meta charset="utf-8"><title>Web de prueba</title><style>body{font:16px system-ui;margin:14px}input{padding:10px}button{padding:10px}section{height:700px;background:#eee}</style><label>Mensaje <input id="field"></label><button id="action">Probar</button><output id="result">Sin usar</output><section>Scroll de prueba</section><script>document.querySelector('#action').onclick=()=>{let v=document.querySelector('#field').value;document.querySelector('#result').textContent=v;parent.postMessage({kind:'qa-frame',value:v},'*')}</script>
