# Lienzo desktop installers. Push a tag like desktop-v0.2.0 (or run it by hand) and three machines build the macOS
# .dmg/.zip, the Windows .exe and the Linux .AppImage/.deb, then attach them to a GitHub Release for that tag.
# Signing is optional: add the secrets listed in docs/desktop.md and the same workflow signs and notarizes.
name: Desktop release

on:
  push:
    tags: ['desktop-v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. 0.2.0 (manual runs upload artifacts only, no release)'
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Version from the tag
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          [ -z "$version" ] && version="${GITHUB_REF_NAME#desktop-v}"
          cd apps/desktop && npm pkg set version="$version"
      - name: Build installers
        run: pnpm --dir apps/desktop release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WIN_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CERTIFICATE_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: lienzo-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Lienzo ${{ github.ref_name }}
          draft: false
          prerelease: true
          generate_release_notes: true
          files: dist/*
